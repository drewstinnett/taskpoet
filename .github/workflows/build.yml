---
# Tests, and a trial run of the release build so a broken .goreleaser.yaml shows
# up on the pull request and not in the middle of a release. Releases themselves
# are release.yml.
name: goreleaser

on:
  pull_request:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      TZ: "America/New_York"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      -
        name: Tests
        run: |
          go mod tidy
          go test ./...
      -
        name: Trial release build
        uses: goreleaser/goreleaser-action@v5
        with:
          version: "~> v2"
          args: release --snapshot --clean
