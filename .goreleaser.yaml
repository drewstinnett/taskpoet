---
version: 2
before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/taskpoet/
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w'
      - -X github.com/drewstinnett/taskpoet/v2/cmd/taskpoet/cmd.date={{ .CommitTimestamp }}
      - -X github.com/drewstinnett/taskpoet/v2/cmd/taskpoet/cmd.version={{ .Tag }}
      - -X github.com/drewstinnett/taskpoet/v2/cmd/taskpoet/cmd.commit={{ .ShortCommit }}
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: 'taskpoet'
archives:
  - formats: [tar.gz]
    name_template: 'taskpoet-{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - completions/*
checksum:
  name_template: 'taskpoet-{{ .Version }}_SHA256SUMS'
  algorithm: sha256
snapshot:
  version_template: "{{ .Tag }}-snapshot"
# Release notes come from the conventional commits since the last release. What
# isn't listed here (docs, tests, ci, chore and so on) is left out.
changelog:
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?[[:word:]]+(\([[:word:]/.-]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]/.-]+\))?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?(fix|perf)(\([[:word:]/.-]+\))?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^(docs|test|ci|chore|style|build)(\([[:word:]/.-]+\))?:'
      - '^Merge '

brews:
  - name: 'taskpoet'
    repository:
      owner: drewstinnett
      name: homebrew-taskpoet
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    description: "Alternative to the awesome TaskWarrior, but in Go, with some additional stuff I find useful"
    homepage: "https://github.com/drewstinnett/taskpoet"
    license: BSD-2-Clause
    caveats: |
      Add the following in your ~/.zshrc or ~/.profile for faster typin':

        alias tp="#{opt_bin}/taskpoet"
    install: |-
      bin.install "taskpoet"
      bash_completion.install "completions/taskpoet.bash" => "taskpoet"
      zsh_completion.install "completions/taskpoet.zsh" => "_taskpoet"
      fish_completion.install "completions/taskpoet.fish"
