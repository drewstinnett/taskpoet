---
version: '3'
tasks:
  prep:
    deps:
      - test
      - doc
  doc:
    cmds:
      - gomarkdoc $(go list ./... | grep -v example) > doc/README.md
  lint:
    cmds:
      - golangci-lint run
  deeplint:
    # Every linter there is, noisy on purpose. godot currently crashes
    # golangci-lint on this repo, so it's left out.
    cmds:
      - golangci-lint run --default all --disable godot
  test:
    cmds:
      - go test ./...
  cover:
    cmds:
      - go test -coverprofile=/tmp/gocover $(go list ./... | grep -v example) && go tool cover -html=/tmp/gocover
  install:
    cmds:
      - go build -o /tmp/taskpoet ./cmd/taskpoet
      - mv /tmp/taskpoet ~/bin/